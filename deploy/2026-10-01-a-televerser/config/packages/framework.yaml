# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    #csrf_protection: true

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Versioning des assets : incrémenter à chaque déploiement modifiant css/js/images
    # (asset('css/style.css') -> /css/style.css?v4). Permet le cache long côté navigateur.
    assets:
        version: 'v7'
        version_format: '%%s?%%s'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
